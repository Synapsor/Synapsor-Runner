services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: harbor_health
      POSTGRES_USER: harbor_admin
      POSTGRES_PASSWORD: harbor_admin_password
    ports:
      - "127.0.0.1:55466:5432"
    healthcheck:
      test: ["CMD-SHELL", "test \"$(psql -U harbor_admin -d harbor_health -tAc \"SELECT pg_postmaster_start_time() > initialized_at FROM public.synapsor_fixture_ready LIMIT 1\" 2>/dev/null | xargs)\" = t"]
      interval: 1s
      timeout: 3s
      retries: 60
    volumes:
      - ./seed/postgres.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
